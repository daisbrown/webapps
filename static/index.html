<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time of Day</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>
<body style="background-color:black; color:white; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
    <div id="root"></div>
    <script type="text/javascript">
        const e = React.createElement;
        function Time() {
            const [time, setTime] = React.useState(new Date());
            React.useEffect(() => {
                const interval = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(interval);
            }, []);
            return e('h1', null, time.toLocaleTimeString());
        }
        ReactDOM.render(e(Time), document.getElementById('root'));
    </script>
</body>
</html>
